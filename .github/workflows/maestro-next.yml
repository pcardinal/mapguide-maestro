name: Maestro.Next CI

on:
  push:
    branches: [ "upgrade-to-NET10", "main" ]
    paths:
      - 'Maestro.Next/**'
      - 'Maestro.Next.Tests/**'
      - 'OSGeo.MapGuide.ObjectModels/**'
      - 'OSGeo.MapGuide.MaestroAPI/**'
      - 'OSGeo.FDO.Expressions/**'
      - '.github/workflows/maestro-next.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'Maestro.Next/**'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: |
          dotnet restore Maestro.Next/Maestro.Next.csproj
          dotnet restore Maestro.Next.Tests/Maestro.Next.Tests.csproj

      - name: Build
        run: dotnet build Maestro.Next/Maestro.Next.csproj --no-restore --configuration Release

      - name: Run tests
        run: dotnet test Maestro.Next.Tests/Maestro.Next.Tests.csproj --no-restore --configuration Release --verbosity normal

      - name: Publish (self-contained)
        run: |
          dotnet publish Maestro.Next/Maestro.Next.csproj \
            --configuration Release \
            --self-contained true \
            --runtime ${{ matrix.rid }} \
            --output publish/${{ matrix.os }}
        env:
          matrix.rid: ${{ matrix.rid }}

    # Override publish step per OS to pass the correct RID
    env:
      matrix.rid: >-
        ${{ matrix.os == 'ubuntu-latest'  && 'linux-x64'   ||
            matrix.os == 'macos-latest'   && 'osx-x64'     ||
            'win-x64' }}

  # Separate publish step using a proper matrix include
  publish:
    name: Publish ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Maestro.Next/Maestro.Next.csproj

      - name: Publish self-contained
        run: >-
          dotnet publish Maestro.Next/Maestro.Next.csproj
          --configuration Release
          --self-contained true
          --runtime ${{ matrix.rid }}
          --output publish/${{ matrix.rid }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaestroNext-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}
          retention-days: 7
